{% extends "base.html" %}

{% block title %}
Party Planner - PocketSmart AI
{% endblock %}


{% block content %}

<section class="planner-page">

    <div class="planner-header">

        <p class="hero-tag">
            PARTY PLANNER
        </p>

        <h1>
            Plan your perfect party
        </h1>

        <p>
            Tell PocketSmart AI about your event and
            get personalized ideas for decorations,
            food, activities and more.
        </p>

    </div>


    <div class="planner-form-card">

        <form
            action="/generate-party"
            method="post"
            class="planner-form"
        >

            <div class="form-group">

                <label for="budget">
                    Budget
                </label>

                <input
                    type="text"
                    id="budget"
                    name="budget"
                    placeholder="Example: ₹15,000"
                    required
                >

            </div>


            <div class="form-group">

                <label for="occasion">
                    Occasion
                </label>

                <select
                    id="occasion"
                    name="occasion"
                    required
                >

                    <option value="">
                        Select an occasion
                    </option>

                    <option value="Birthday">
                        Birthday
                    </option>

                    <option value="Wedding">
                        Wedding
                    </option>

                    <option value="Anniversary">
                        Anniversary
                    </option>

                    <option value="Graduation">
                        Graduation
                    </option>

                    <option value="Festival">
                        Festival
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="guests">
                    Number of Guests
                </label>

                <input
                    type="number"
                    id="guests"
                    name="guests"
                    min="1"
                    placeholder="Example: 25"
                    required
                >

            </div>


            <div class="form-group">

                <label for="theme">
                    Party Theme
                </label>

                <input
                    type="text"
                    id="theme"
                    name="theme"
                    placeholder="Example: Blue and white"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn primary-btn full-width"
            >
                Generate AI Party Plan
            </button>

        </form>

    </div>

</section>

{% endblock %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>

<body>

    <header class="navbar">

        <div class="logo">
            PocketSmart AI
        </div>

        <nav>

            <a href="/">
                Home
            </a>

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/history">
                History
            </a>

            <a href="/testimonials">
                Testimonials
            </a>

            {% if request.session.get("user_id") %}

                <a href="/logout">
                    Logout
                </a>

            {% else %}

                <a href="/login">
                    Login
                </a>

                <a href="/register">
                    Register
                </a>

            {% endif %}

        </nav>

    </header>


    <main>

        {% block content %}

        {% endblock %}

    </main>


    <footer>

        <p>
            © 2026 PocketSmart AI
        </p>

        <p>
            AI-powered recommendations for everyday planning.
        </p>

    </footer>


    <script
        src="{{ url_for('static', path='js/app.js') }}"
    ></script>

</body>

</html>
